<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a0a1e">
<title>Diwali Dhamaka · QR screen</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest-qr-screen.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<link rel="stylesheet" href="assets/dhamaka.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #14040e; }
  .toran-top { position: absolute; left: 0; right: 0; top: 0; height: 96px; background: url("assets/toran.svg") repeat-x; background-size: auto 96px; z-index: 3; }
  .screen::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, var(--saffron), var(--gold), var(--saffron)); }
  .art { position: absolute; right: 70px; top: 130px; width: 820px; height: 820px; opacity: 0.32; animation: turn 150s linear infinite; will-change: transform; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .left { position: absolute; left: 120px; top: 140px; width: 860px; }
  .mark { width: 120px; height: 120px; display: block; margin-left: -10px; }
  .wm { font-family: var(--display); font-size: 128px; line-height: 0.98; color: var(--gold); }
  .yr { font: 800 28px 'Manrope', sans-serif; letter-spacing: 0.36em; text-transform: uppercase; color: var(--cream); margin-top: 14px; }
  h1 { font: 800 66px/1.05 'Poppins', sans-serif; margin: 44px 0 0; }
  h1 em { font-style: normal; color: var(--marigold); }
  .lines { margin-top: 22px; font-size: 30px; line-height: 1.5; color: var(--dim); font-weight: 700; }
  .lines b { color: var(--ink); }
  .host { position: absolute; left: 120px; bottom: 70px; display: flex; align-items: center; gap: 22px; font-size: 20px; font-weight: 800; letter-spacing: 6px; text-transform: uppercase; color: var(--faint); }
  .host img { height: 52px; }
  .qr { position: absolute; right: 200px; top: 220px; width: 660px; height: 660px; padding: 34px; border-radius: 44px; background: #fff; box-shadow: 0 0 0 10px rgba(var(--gold-rgb), 0.6), 0 0 120px 10px rgba(var(--marigold-rgb), 0.35); }
  .qr img, .qr canvas { display: block; width: 100% !important; height: 100% !important; }
  .pulse { position: absolute; right: 200px; top: 220px; width: 660px; height: 660px; border-radius: 44px; border: 4px solid var(--gold); opacity: 0; animation: ring 2.8s ease-out infinite; pointer-events: none; }
  @keyframes ring { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.08); } }
  .scan { position: absolute; right: 200px; top: 912px; width: 660px; text-align: center; }
  .scan b { display: block; font: 800 34px 'Poppins', sans-serif; }
  .scan span { display: block; margin-top: 4px; font-size: 22px; font-weight: 700; color: var(--gold); letter-spacing: 1px; }
</style>
</head>
<body>
<main class="screen">
  <img class="art" src="assets/mandala.svg" alt="" aria-hidden="true">
  <div class="toran-top" aria-hidden="true"></div>
  <section class="left">
    <img class="mark" data-cfg="logos.event" alt="">
    <div class="wm" data-cfg="eventName"></div>
    <div class="yr" data-cfg="tagline"></div>
    <h1 id="h1"></h1>
    <div class="lines" id="lines"></div>
  </section>
  <div class="host">Hosted by <img data-cfg="logos.company" alt="Techniline Electronics"></div>
  <div class="pulse" aria-hidden="true"></div>
  <div class="qr" id="qr"></div>
  <div class="scan"><b>Scan with your phone camera</b><span id="url"></span></div>
</main>
<script src="assets/api.js"></script>
<script src="assets/fullscreen.js"></script>
<script src="assets/screen.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/qr-targets.js"></script>
<script>
// ?for=photos (default) or ?for=checkin
R.brand();
var T = qrTarget();
document.getElementById("h1").innerHTML = T.headline;
document.getElementById("lines").innerHTML = T.lines;
document.getElementById("url").textContent = T.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
new QRCode(document.getElementById("qr"), { text: T.url, width: 640, height: 640, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.Q });
</script>
</body>
</html>

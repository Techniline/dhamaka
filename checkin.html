<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a0a1e">
<title>Diwali Dhamaka · Check-in</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest-checkin.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Check-in">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<link rel="stylesheet" href="assets/roshni.css">
<style>
  body { min-height: 100svh; }
  .top { position: sticky; top: 0; z-index: 20; padding: max(10px, env(safe-area-inset-top)) 14px 10px; background: #200716; border-bottom: 1px solid var(--gold-hair); }
  .bar1 { display: flex; align-items: center; gap: 10px; max-width: 1200px; margin: 0 auto; }
  .bar1 img { width: 36px; height: 36px; }
  .bar1 .wordmark { font-size: 26px; }
  .bar1 .what { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); margin-top: 2px; }
  .sync { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); white-space: nowrap; }
  .sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #5bd17a; box-shadow: 0 0 8px #5bd17a; }
  .sync.off::before { background: #ff6b6b; box-shadow: 0 0 8px #ff6b6b; }
  .sync.busy::before { background: var(--gold); box-shadow: 0 0 8px var(--gold); }

  .tot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 1200px; margin: 10px auto 0; }
  .tot div { padding: 6px 6px 5px; border-radius: 14px; text-align: center; background: rgba(0,0,0,0.25); border: 1px solid var(--gold-hair); }
  .tot b { display: block; font: 800 21px/1.1 var(--heading); white-space: nowrap; color: var(--gold); font-variant-numeric: tabular-nums; }
  .tot > div > span { font-size: 11px; font-weight: 700; color: var(--dim); letter-spacing: 0.04em; }
  .tot small { font-size: 13px; color: var(--faint); font-weight: 700; }
  .export { flex: none; min-height: 36px; padding: 0 12px; font-size: 12.5px; }
  @media (max-width: 520px) { .chip { min-height: 34px; padding: 0 11px; font-size: 12.5px; } .tools .chips { flex-wrap: nowrap; } .top { padding-bottom: 8px; } .tot { margin-top: 8px; } .tools { margin-top: 8px; } }

  .tools { display: flex; gap: 8px; align-items: center; max-width: 1200px; margin: 10px auto 0; flex-wrap: wrap; }
  .search { position: relative; flex: 1 1 260px; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .search .input { padding-left: 42px; padding-right: 40px; }
  .search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--faint); cursor: pointer; font-size: 20px; }

  main { max-width: 1200px; margin: 0 auto; padding: 12px 14px 120px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 10px; }
  .p { position: relative; min-height: 92px; padding: 12px 12px 30px; border-radius: 16px; text-align: left; border: 1px solid var(--hair-strong); background: rgba(var(--surface-rgb), 0.85); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .12s var(--ease), border-color .2s, background .2s; }
  .p:active { transform: scale(0.97); }
  .p .nm { display: block; font-weight: 800; font-size: 15px; line-height: 1.25; padding-right: 26px; word-break: break-word; }
  .p .dp { display: block; font-size: 12px; color: var(--dim); margin-top: 3px; }
  .p .no { position: absolute; left: 12px; bottom: 9px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--faint); font-variant-numeric: tabular-nums; }
  .p .tick { position: absolute; right: 10px; top: 10px; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--hair-strong); display: grid; place-items: center; }
  .p .gb { position: absolute; right: 10px; bottom: 8px; padding: 1px 8px; border-radius: 999px; background: var(--rose); color: #fff; font-size: 12px; font-weight: 800; }
  .p.in { border-color: rgba(var(--gold-rgb), 0.7); background: linear-gradient(160deg, rgba(var(--gold-rgb), 0.16), rgba(var(--surface-rgb), 0.9) 70%); }
  .p.in .tick { background: var(--gold); border-color: var(--gold); color: #3a1206; }
  .p.in .no { color: var(--gold); }
  .p.pending { opacity: 0.6; }
  .empty { text-align: center; padding: 50px 20px; color: var(--dim); }
  .empty a { font-weight: 800; }

  /* the panel for one employee */
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(15, 3, 10, 0.7); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 520px; max-height: 92svh; overflow: auto; padding: 18px 18px calc(22px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; background: var(--surface); border: 1px solid var(--gold-hair); border-bottom: 0; animation: up .28s var(--ease); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 24px; border-bottom: 1px solid var(--gold-hair); } }
  .sh-head { display: flex; gap: 12px; align-items: flex-start; }
  .sh-head h2 { margin: 0; font: 800 22px/1.2 var(--heading); }
  .sh-head p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
  .x { margin-left: auto; flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--hair-strong); background: transparent; color: var(--ink); cursor: pointer; font-size: 20px; }
  .big { width: 100%; min-height: 58px; margin-top: 16px; font-size: 17px; }
  .done { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 14px; border-radius: 16px; background: rgba(var(--gold-rgb), 0.12); border: 1px solid rgba(var(--gold-rgb), 0.5); }
  .done .ok { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: #3a1206; display: grid; place-items: center; flex: none; }
  .done b { display: block; color: var(--gold); }
  .done span { font-size: 12.5px; color: var(--dim); }
  .done .btn { margin-left: auto; }
  .guests { margin-top: 18px; }
  .guests h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--marigold); }
  .g { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); }
  .g .gn { font-weight: 700; }
  .g .gno { font-size: 12px; color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
  .g button { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--hair-strong); background: transparent; color: var(--dim); cursor: pointer; display: grid; place-items: center; }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add .input { flex: 1; min-width: 0; }
  .sum { margin-top: 16px; padding: 12px; text-align: center; border-radius: 14px; background: rgba(0,0,0,0.25); font-weight: 800; color: var(--marigold); }
  .toast { top: calc(12px + env(safe-area-inset-top)); bottom: auto; transform: translateY(-10px); }
  .toast.show { transform: none; }
  .note { font-size: 12.5px; color: var(--faint); margin: 8px 0 0; }
</style>
</head>
<body>
<header class="top">
  <div class="bar1">
    <img data-cfg="logos.event" alt="">
    <div><div class="wordmark" data-cfg="eventName"></div><div class="what">Check-in</div></div>
    <span class="sync busy" id="sync">Loading…</span>
    <button class="btn btn-ghost export" id="export" type="button" title="Download a CSV of check-ins and guests">CSV</button>
  </div>
  <div class="tot" aria-live="polite">
    <div><b><span id="t-in">0</span> <small id="t-of"></small></b><span>checked in</span></div>
    <div><b id="t-g">0</b><span>guests</span></div>
    <div><b id="t-e">0</b><span>draw entries</span></div>
  </div>
  <div class="tools">
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="input" id="q" type="search" placeholder="Search name, department, ID or DW number" autocomplete="off" enterkeyhint="search" aria-label="Search employees">
      <button class="clear" id="q-clear" type="button" aria-label="Clear search" hidden>×</button></label>
    <div class="chips" role="tablist" id="filters">
      <button class="chip on" data-f="all" type="button">All <b id="c-all">0</b></button>
      <button class="chip" data-f="in" type="button">Checked in <b id="c-in">0</b></button>
      <button class="chip" data-f="out" type="button">Not yet <b id="c-out">0</b></button>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>

<div class="scrim" id="scrim" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-name"></section>
</div>

<script src="assets/api.js"></script>
<script src="assets/fullscreen.js"></script>
<script>
// Check-in for the door team. Tap an employee to check them in and add their guests.
// Changes go to the Apps Script one at a time under a lock (no double counting
// across phones); the list refreshes every 15 seconds.
var $ = function (id) { return document.getElementById(id); };
R.brand();
var people = [], byId = {}, filter = "all", query = "", openId = 0, pending = {}, lastSync = 0, loading = false;

function load() {
  if (loading) return Promise.resolve();
  loading = true;
  return R.get("people").then(function (res) {
    var fresh = res.people || [];
    // keep this phone's own changes that are still on their way
    fresh = fresh.map(function (p) { return pending[p.id] ? (byId[p.id] || p) : p; });
    setPeople(fresh);
    lastSync = Date.now(); paintSync();
  }).catch(function (e) {
    $("sync").className = "sync off"; $("sync").textContent = e.message && /staff link/.test(e.message) ? "Staff link needed" : /Not connected/.test(e.message) ? "Not connected" : "Offline, retrying";
    if (!people.length) showEmpty(e.message || "Couldn't load the list.");
  }).then(function () { loading = false; });
}
function setPeople(list) {
  people = list; byId = {};
  people.forEach(function (p) { byId[p.id] = p; });
  render();
  if (openId) { if (byId[openId]) paintSheet(); else closeSheet(); }
}
function paintSync() {
  if (Object.keys(pending).length) { $("sync").className = "sync busy"; $("sync").textContent = "Saving…"; return; }
  var s = Math.round((Date.now() - lastSync) / 1000);
  $("sync").className = "sync" + (s > 60 ? " off" : "");
  $("sync").textContent = s < 5 ? "Up to date" : "Synced " + (s < 60 ? s + " s" : Math.round(s / 60) + " min") + " ago";
}

// ---------------------------------------------------------------- grid
function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function matches(p, q) {
  if (!q) return true;
  var hay = norm(p.name + " " + p.dept + " " + p.code + " " + (p.g || []).map(function (g) { return g.name; }).join(" "));
  var num = q.replace(/^dw-?0*/i, "");
  if (/^\d+$/.test(num) && (p.n === Number(num) || (p.g || []).some(function (g) { return g.n === Number(num); }))) return true;
  return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
}
function render() {
  var t = R.totals(people);
  $("t-in").textContent = t.inside; $("t-of").textContent = "/ " + t.people; $("t-g").textContent = t.guests; $("t-e").textContent = t.entries;
  $("c-all").textContent = t.people; $("c-in").textContent = t.inside; $("c-out").textContent = t.people - t.inside;
  var q = norm(query.trim());
  var list = people.filter(function (p) {
    if (filter === "in" && !p.n) return false;
    if (filter === "out" && p.n) return false;
    return matches(p, q);
  }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  var html = "";
  list.forEach(function (p) {
    var g = (p.g || []).length;
    html += '<button type="button" class="p' + (p.n ? " in" : "") + (pending[p.id] ? " pending" : "") + '" data-id="' + p.id + '" aria-label="' + R.esc(p.name) + (p.n ? ", checked in" : ", not checked in") + '">' +
      '<span class="nm">' + R.esc(p.name) + '</span>' +
      (p.dept || p.code ? '<span class="dp">' + [p.dept, p.code].filter(Boolean).map(R.esc).join(" · ") + '</span>' : "") +
      '<span class="tick" aria-hidden="true">' + (p.n ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' : "") + '</span>' +
      (p.n ? '<span class="no">' + R.drawNo(p.n) + '</span>' : "") +
      (g ? '<span class="gb">+' + g + '</span>' : "") + '</button>';
  });
  $("grid").innerHTML = html;
  if (!people.length) showEmpty('No employees yet. Add the list in <a href="admin.html#people">admin</a>.');
  else if (!list.length) showEmpty("No one matches " + (query ? "“" + R.esc(query) + "”" : "this filter") + ".");
  else $("empty").hidden = true;
}
function showEmpty(html) { $("empty").innerHTML = html; $("empty").hidden = false; }

$("grid").addEventListener("click", function (e) { var b = e.target.closest(".p"); if (b) openSheet(Number(b.dataset.id)); });
$("q").addEventListener("input", function () { query = this.value; $("q-clear").hidden = !query; render(); });
$("q-clear").addEventListener("click", function () { $("q").value = ""; query = ""; this.hidden = true; render(); $("q").focus(); });
$("filters").addEventListener("click", function (e) {
  var b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.f;
  this.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("on", c === b); });
  render();
});
$("export").addEventListener("click", function () { R.exportCheckins(people); });

// ---------------------------------------------------------------- one employee
function openSheet(id) { var gi = $("g-name"); if (gi) { gi.value = ""; gi.blur(); } openId = id; paintSheet(); $("scrim").hidden = false; }
function closeSheet() { openId = 0; $("scrim").hidden = true; }
$("scrim").addEventListener("click", function (e) { if (e.target === this) closeSheet(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

function paintSheet() {
  var p = byId[openId]; if (!p) return closeSheet();
  var busy = !!pending[p.id], guests = p.g || [], n = guests.length;
  // the guest box keeps what's typed, and its focus, when the panel repaints
  var gi = $("g-name"), focused = !!gi && document.activeElement === gi, keep = gi ? gi.value : "";
  var html = '<div class="sh-head"><div><h2 id="sh-name">' + R.esc(p.name) + '</h2><p>' + [p.dept, p.code].filter(Boolean).map(R.esc).join(" · ") + '</p></div>' +
    '<button class="x" type="button" data-act="close" aria-label="Close">×</button></div>';
  if (!p.n) {
    html += '<button class="btn btn-primary big" type="button" data-act="in"' + (busy ? " disabled" : "") + '>' + (busy ? "Checking in…" : "Check in") + '</button>';
  } else {
    html += '<div class="done"><span class="ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>' +
      '<div><b>Checked in · ' + R.drawNo(p.n) + '</b><span>' + R.stamp(p.t) + '</span></div>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-act="out"' + (busy ? " disabled" : "") + '>Undo</button></div>';
    html += '<div class="guests"><h3>Guests</h3>';
    guests.forEach(function (g) {
      html += '<div class="g"><div><div class="gn">' + R.esc(g.name) + '</div><div class="gno">' + (g.n ? R.drawNo(g.n) : "Adding…") + '</div></div>' +
        (g.n ? '<button type="button" data-act="rm" data-n="' + g.n + '" aria-label="Remove ' + R.esc(g.name) + '"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>' : "") + '</div>';
    });
    html += '<form class="add" id="g-form" autocomplete="off"><input class="input" id="g-name" placeholder="Guest name" maxlength="60" enterkeyhint="done" aria-label="Guest name"><button class="btn btn-primary" type="submit">Add</button></form></div>';
    html += '<div class="sum">Employee + ' + n + (n === 1 ? " guest" : " guests") + ' = ' + (n + 1) + (n ? " entries" : " entry") + '</div>';
  }
  if (!p.n) html += '<p class="note">Guests can be added after check-in. Each checked-in employee and guest gets one draw entry.</p>';
  $("sheet").innerHTML = html;
  var gf = $("g-form");
  if (gf) {
    $("g-name").value = keep;
    if (focused) $("g-name").focus();
    gf.addEventListener("submit", function (e) { e.preventDefault(); addGuest(p.id, $("g-name").value); });
  }
}
$("sheet").addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var p = byId[openId]; if (!p) return;
  var act = b.dataset.act;
  if (act === "close") closeSheet();
  else if (act === "in") change(p, { action: "checkin", id: p.id, on: true }, function (x) { x.n = -1; }, "Checked in " + p.name);
  else if (act === "out") {
    var g = (p.g || []).length;
    if (!confirm("Undo check-in for " + p.name + "?" + (g ? " Their " + g + (g === 1 ? " guest" : " guests") + " will be removed too." : "") + " Their draw number" + (g ? "s are" : " is") + " retired and won't be reused.")) return;
    change(p, { action: "checkin", id: p.id, on: false }, function (x) { x.n = 0; x.g = []; }, "Check-in undone");
  } else if (act === "rm") {
    var n = Number(b.dataset.n), guest = (p.g || []).filter(function (x) { return x.n === n; })[0];
    if (!guest || !confirm("Remove " + guest.name + " (" + R.drawNo(n) + ")?")) return;
    change(p, { action: "guestRemove", id: p.id, n: n }, function (x) { x.g = x.g.filter(function (y) { return y.n !== n; }); }, "Removed " + guest.name);
  }
});
function addGuest(id, name) {
  name = String(name || "").trim();
  if (name.length < 2) { R.toast("Type the guest's name first"); $("g-name").focus(); return; }
  var p = byId[id];
  change(p, { action: "guestAdd", id: id, name: name }, function (x) { x.g = (x.g || []).concat([{ n: 0, name: name }]); }, "Added " + name);
  setTimeout(function () { var i = $("g-name"); if (i) { i.value = ""; i.focus(); } }, 0);
}

// Show the change straight away, send it, then take the server's version.
// If it fails, put things back and say why.
function change(p, body, optimistic, okMsg) {
  var before = JSON.parse(JSON.stringify(p));
  var draft = JSON.parse(JSON.stringify(p)); optimistic(draft);
  if (draft.n === -1) draft.n = 0;
  byId[p.id] = draft; people = people.map(function (x) { return x.id === p.id ? draft : x; });
  pending[p.id] = (pending[p.id] || 0) + 1;
  render(); paintSheet(); paintSync();
  R.post(body).then(function (res) {
    if (res.person) { byId[p.id] = res.person; people = people.map(function (x) { return x.id === p.id ? res.person : x; }); }
    R.toast(okMsg);
  }).catch(function (e) {
    byId[p.id] = before; people = people.map(function (x) { return x.id === p.id ? before : x; });
    R.toast("Didn't save: " + (e.message || "try again"), 5000);
  }).then(function () {
    if (!--pending[p.id]) delete pending[p.id];
    render(); if (openId === p.id) paintSheet(); paintSync();
  });
}

load();
setInterval(function () { if (!document.hidden && !Object.keys(pending).length) load(); }, 15000);
setInterval(paintSync, 5000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
</script>
</body>
</html>

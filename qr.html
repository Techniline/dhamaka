<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Diwali Dhamaka · A4 poster</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<link rel="stylesheet" href="assets/roshni.css">
<style>
  @page { size: A4; margin: 0; }
  html, body { background: #3b3437; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar { text-align: center; padding: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .poster { width: 210mm; height: 297mm; margin: 0 auto 24px; position: relative; overflow: hidden; background: var(--background) url("assets/rangoli-tile.svg"); background-size: 18mm 18mm;
    display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26mm 16mm 14mm; color: var(--ink); }
  .toran { position: absolute; left: 0; right: 0; top: 0; height: 20mm; background-size: auto 20mm; }
  .art { position: absolute; left: 50%; top: 92mm; width: 190mm; transform: translateX(-50%); opacity: 0.22; }
  .mark { position: relative; width: 30mm; height: 30mm; }
  .wordmark { position: relative; font-size: 66pt; }
  .yr { position: relative; font-size: 12pt; font-weight: 800; letter-spacing: 0.34em; text-transform: uppercase; margin-top: 1mm; }
  .when { position: relative; font-size: 11pt; color: var(--dim); margin-top: 2mm; }
  h1 { position: relative; font: 800 28pt/1.05 'Poppins', sans-serif; margin: 8mm 0 0; }
  h1 em { font-style: normal; color: var(--marigold); }
  .qr { position: relative; margin-top: 8mm; width: 84mm; height: 84mm; padding: 5mm; background: #fff; border-radius: 7mm; box-shadow: 0 0 0 2mm rgba(var(--gold-rgb), 0.6); }
  .qr img, .qr canvas { width: 100% !important; height: 100% !important; display: block; }
  .scan { position: relative; margin-top: 8mm; font-size: 16pt; font-weight: 800; }
  .lines { position: relative; margin-top: 3mm; font-size: 11.5pt; color: var(--dim); line-height: 1.55; }
  .lines b { color: var(--ink); }
  .url { position: relative; margin-top: 3mm; font-size: 11pt; color: var(--gold); letter-spacing: 0.03em; }
  .foot { position: relative; margin-top: auto; display: flex; align-items: center; gap: 4mm; font-size: 9pt; letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint); padding: 0; }
  .foot img { height: 8mm; margin: 0; }
  @media print { html, body { background: none; } .bar { display: none; } .poster { margin: 0; } }
  @media screen and (max-width: 820px) { .poster { zoom: 0.45; } }
</style>
</head>
<body>
<div class="bar">
  <button class="btn btn-primary btn-sm" type="button" onclick="print()">Print or save as PDF</button>
  <a class="btn btn-ghost btn-sm" href="?for=photos">Photos poster</a>
  <a class="btn btn-ghost btn-sm" href="?for=checkin">Check-in poster</a>
</div>
<div class="poster">
  <div class="toran" aria-hidden="true"></div>
  <img class="art" src="assets/mandala.svg" alt="" aria-hidden="true">
  <img class="mark" data-cfg="logos.event" alt="">
  <div class="wordmark" data-cfg="eventName"></div>
  <div class="yr" data-cfg="tagline"></div>
  <div class="when" id="when" hidden></div>
  <h1 id="h1"></h1>
  <div class="qr" id="qr"></div>
  <div class="scan">Scan with your phone camera</div>
  <div class="lines" id="lines"></div>
  <div class="url" id="url"></div>
  <div class="foot">Hosted by <img data-cfg="logos.company" alt="Techniline Electronics"></div>
</div>
<script src="assets/api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/qr-targets.js"></script>
<script>
R.brand();
var CFG = R.cfg, T = qrTarget();
var when = [CFG.dateText, CFG.venue].filter(Boolean).join(" · ");
if (when) { document.getElementById("when").textContent = when; document.getElementById("when").hidden = false; }
document.getElementById("h1").innerHTML = T.headline;
document.getElementById("lines").innerHTML = T.lines;
document.getElementById("url").textContent = T.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
document.title = "Diwali Dhamaka · A4 poster · " + (T.which === "checkin" ? "check-in" : "photos");
new QRCode(document.getElementById("qr"), { text: T.url, width: 800, height: 800, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.Q });
</script>
</body>
</html>
